services:
  web:
    build:
      context: .
      pull: true  # B3345: re-pull nginx:alpine on every build (stale base = old openssl)
    ports:
      - "${PORT:-1705}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
