<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salvioni Showroom | Sporck Living</title>
  <meta name="description" content="Salvioni Showroom — a university showroom design project featuring Baxter, Moroso, Oluce, and Gallotti &amp; Radice.">

  <!-- Open Graph -->
  <meta property="og:title" content="Salvioni Showroom | Sporck Living">
  <meta property="og:description" content="Salvioni Showroom — a university showroom design project featuring Baxter, Moroso, Oluce, and Gallotti &amp; Radice.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sporckliving.com/projects/salvioni-showroom.html">
  <meta property="og:image" content="https://sporckliving.com/assets/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Google Fonts: Josefin Sans (Light 300, Regular 400) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">

  <!-- TailwindCSS 4.0 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss = { config: { theme: { extend: {
      colors: {
        'warm': '#E8E7E6',
        'heading': '#6E6E6E',
        'nav': '#9B9B9B',
        'body-text': '#878787',
        'subtitle': '#B9B9B9',
        'light': '#AFAFAF',
        'separator': '#D7D7D7',
        'accent-blue': '#CDD7DC',
        'accent-pink': '#EBC8C3',
      },
      fontFamily: {
        'sans': ['"Josefin Sans"', 'sans-serif'],
      },
    }}}}
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="font-sans text-body-text antialiased">

  <!-- Skip to content -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:bg-white focus:px-4 focus:py-2 focus:z-50 focus:text-heading">
    Skip to main content
  </a>

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-40 bg-white/80 backdrop-blur-sm">
    <div class="max-w-[1100px] mx-auto px-4 md:px-8 py-6 flex items-center justify-between">
      <!-- Logo -->
      <a href="/" aria-label="Sporck Living — Home">
        <img src="/assets/images/logo-sl.svg" alt="" class="h-10 text-heading" aria-hidden="true">
      </a>

      <!-- Desktop nav -->
      <nav class="hidden md:flex items-center gap-12" aria-label="Main navigation">
        <a href="/about.html" class="text-nav text-xs tracking-[0.15em] uppercase font-light hover:text-heading transition-colors duration-150">About Me</a>
        <a href="/projects.html" class="text-nav text-xs tracking-[0.15em] uppercase font-light hover:text-heading transition-colors duration-150">Projects</a>
        <a href="/contacts.html" class="text-nav text-xs tracking-[0.15em] uppercase font-light hover:text-heading transition-colors duration-150">Contacts</a>
      </nav>

      <!-- Mobile hamburger -->
      <button id="mobile-menu-btn" class="md:hidden text-heading p-2" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile menu overlay -->
  <div id="mobile-menu" class="fixed inset-0 z-50 bg-warm hidden flex-col items-center justify-center" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <button id="mobile-menu-close" class="absolute top-6 right-8 text-heading p-2" aria-label="Close menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    <nav class="flex flex-col items-center gap-8" aria-label="Main navigation">
      <a href="/" class="text-heading text-sm tracking-[0.15em] uppercase font-light">Home</a>
      <a href="/about.html" class="text-heading text-sm tracking-[0.15em] uppercase font-light">About Me</a>
      <a href="/projects.html" class="text-heading text-sm tracking-[0.15em] uppercase font-light">Projects</a>
      <a href="/contacts.html" class="text-heading text-sm tracking-[0.15em] uppercase font-light">Contacts</a>
    </nav>
  </div>

  <!-- Main content -->
  <main id="main-content" class="bg-white pt-28 pb-16">
    <div class="max-w-[1100px] mx-auto px-4 md:px-8">

      <!-- Back link -->
      <a href="/projects.html" class="text-nav text-xs tracking-[0.15em] uppercase font-light inline-flex items-center gap-2 hover:text-heading transition-colors duration-150 mb-12">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
        Back to Projects
      </a>

      <!-- Project content -->
      <section>
        <h1 class="text-heading font-light text-2xl md:text-3xl tracking-[0.1em] md:tracking-[0.3em] uppercase mb-10">
          Salvioni Showroom
        </h1>

        <!-- Layout: floor plan + legend -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 lg:gap-12">

          <!-- Floor plan placeholder (spans 2 columns on large screens) -->
          <div class="lg:col-span-2">
            <div class="aspect-[16/9] bg-separator w-full" role="img" aria-label="Salvioni Showroom floor plan"></div>
          </div>

          <!-- Brand legend -->
          <div class="flex flex-col justify-center">
            <h2 class="text-heading font-light text-sm tracking-[0.15em] uppercase mb-6">Brands</h2>
            <div class="flex flex-col gap-5">
              <div class="flex items-center gap-3">
                <svg class="w-3 h-3 flex-shrink-0" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="6" fill="#8B7355"/>
                </svg>
                <span class="text-body-text text-sm tracking-[0.05em]">Baxter</span>
              </div>
              <div class="flex items-center gap-3">
                <svg class="w-3 h-3 flex-shrink-0" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="6" fill="#C4918A"/>
                </svg>
                <span class="text-body-text text-sm tracking-[0.05em]">Moroso</span>
              </div>
              <div class="flex items-center gap-3">
                <svg class="w-3 h-3 flex-shrink-0" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="6" fill="#7A8B6F"/>
                </svg>
                <span class="text-body-text text-sm tracking-[0.05em]">Oluce</span>
              </div>
              <div class="flex items-center gap-3">
                <svg class="w-3 h-3 flex-shrink-0" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="6" fill="#6B8BA4"/>
                </svg>
                <span class="text-body-text text-sm tracking-[0.05em]">Gallotti &amp; Radice</span>
              </div>
            </div>
          </div>

        </div>
      </section>

    </div>
  </main>

  <script src="/js/main.js" defer></script>
</body>
</html>
